global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Enable remote write receiver (Alloy pushes metrics here)
# Prometheus v2.x enables this via --web.enable-remote-write-receiver flag
# which is set in docker-compose command

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Alloy metrics
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']