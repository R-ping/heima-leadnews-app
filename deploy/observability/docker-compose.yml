networks:
  observability:
    driver: bridge

services:
  # ============================================================
  # Alloy — OpenTelemetry Collector, recibe señales y las enruta
  # ============================================================
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - ./alloy/data:/var/lib/alloy
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # Prometheus — Métricas
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
      - ./prometheus/data:/prometheus
    user: "0:0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # Loki — Logs
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - ./loki/data:/loki
    user: "0:0"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # MinIO — Almacenamiento de objetos (backend de Loki)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # MinIO Init — Crea el bucket loki-data al arrancar
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set minio http://minio:9000 minioadmin minioadmin
        mc mb minio/loki-data --ignore-existing
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - observability

  # ============================================================
  # Jaeger — Trazas distribuidas
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"   # UI
      - "14317:4317"    # OTLP gRPC (host 14317 → container 4317)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - ./jaeger/data:/badger
    user: "0:0"
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # Grafana — Visualización unificada
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - observability
    restart: unless-stopped

  # ============================================================
  # AlertManager — Gestión de alertas
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - observability
    restart: unless-stopped