global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook'
  routes:
    - match:
        severity: critical
      receiver: 'webhook'
      group_wait: 5s
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'webhook'
      repeat_interval: 2h

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/alert/webhook'
        send_resolved: true