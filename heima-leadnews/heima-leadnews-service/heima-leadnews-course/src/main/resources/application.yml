server:
  port: 51803
spring:
  application:
    name: leadnews-course
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/leadnews_article?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: 192.168.44.128
    port: 5672
    username: admin
    password: admin
    connection-timeout: 5000ms
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 1
        max-attempts: 2
    publisher-confirm-type: correlated

# 支付宝沙箱配置（通过环境变量注入）
alipay:
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:51601/course/api/v1/pay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:9901/course/pay-result}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.heima.course: debug