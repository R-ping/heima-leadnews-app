spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedHeaders: "*"
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - DELETE
              - PUT
              - OPTION
      routes:
        # 用户微服务
        - id: user
          uri: lb://leadnews-user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        # 内容微服务（原文章微服务，已合并课程、行为、Schedule等）
        - id: content
          uri: lb://leadnews-content
          predicates:
            - Path=/content/**
          filters:
            - StripPrefix=1
        #搜索微服务
        - id: leadnews-search
          uri: lb://leadnews-search
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1
        
        # 自媒体微服务（wemedia前端已合并到app，路由统一走app gateway鉴权）
        - id: wemedia
          uri: lb://leadnews-wemedia
          predicates:
            - Path=/wemedia/**
          filters:
            - StripPrefix=1
        # 站内信微服务
        - id: leadnews-notification
          uri: lb://leadnews-notification
          predicates:
            - Path=/notification/**
          filters:
            - StripPrefix=1
